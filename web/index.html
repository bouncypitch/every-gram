<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08090a" />
  <title>Every Gram</title>
  <meta name="description" content="Every gram has to justify itself. AI proposes, physics decides." />
</head>
<body data-stage="0">
  <canvas id="gl" aria-label="3D model of the robot. Drag to orbit, click a part for detail."></canvas>

  <header class="top">
    <button class="mark" id="home">Every Gram</button>
    <nav>
      <button id="nav-materials">Materials</button>
      <button id="nav-robot">Whole robot</button>
      <button id="nav-auto" aria-pressed="false">Auto</button>
    </nav>
  </header>

  <main class="landing" id="landing">
    <h1>Every gram has to<br />justify itself.</h1>
    <p class="sub">Paste a robot. AI proposes, physics decides.</p>
    <form id="link-form">
      <input id="link" type="url" spellcheck="false" autocomplete="off" aria-label="Robot link"
        value="https://github.com/HybridRobotics/Berkeley-Humanoid-Lite" />
      <button type="submit" id="go">Analyze</button>
    </form>
    <div class="chips" id="chips"></div>
    <p class="msg" id="link-msg" role="status"></p>
  </main>

  <section class="prod" id="prod" aria-live="polite"></section>

  <section class="copy" id="copy" aria-live="polite"></section>

  <section class="opt" id="opt">
    <div class="opt-head">
      <div class="eyebrow"><span id="opt-count"></span> <span class="tag" id="opt-replay">Stored results, replayed</span></div>
      <div class="opt-part" id="opt-part"></div>
      <div class="opt-mass" id="opt-mass"></div>
    </div>
    <div class="lanes" id="lanes"></div>
    <p class="note" id="opt-note"></p>
  </section>

  <section class="summary" id="summary"></section>

  <div class="tools" id="tools"></div>

  <footer class="bottom" id="bottom">
    <div class="tiers" id="tiers"></div>
    <div class="hint"><span id="steps" class="steps"></span><span class="key"><kbd>Space</kbd> next</span></div>
  </footer>

  <aside class="panel" id="panel" aria-label="Part detail"></aside>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-in" id="sheet-in"></div></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
